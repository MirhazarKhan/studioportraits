[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studioportraits"
version = "1.0.0"
authors = [
  { name = "Mir Hazar Khan", email = "mirhazarkhanchandio@gmail.com" },
]
description = "An open-source AI studio headshot & portrait generation pipeline with biometric calibration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "streamlit>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/MirhazarKhan/studioportraits"
Documentation = "https://github.com/MirhazarKhan/studioportraits#readme"
Repository = "https://github.com/MirhazarKhan/studioportraits.git"
"Bug Tracker" = "https://github.com/MirhazarKhan/studioportraits/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
studioportraits = "main:main"
portrait-generator = "main:main"
